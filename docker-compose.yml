version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracer_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    networks:
      - laravel
    expose:
      - 9000

  web:
    image: nginx:alpine
    container_name: tracer_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: tracer_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tracer
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tracer
      MYSQL_PASSWORD: tracer
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:

volumes:
  db_data:
