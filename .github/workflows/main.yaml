name: CI/CD Tracer Alumni ITATS

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    
    services:
      mysql_main:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tc_main
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, gd, zip, intl
        coverage: xdebug

    - name: Install Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Migrations & Seeding (1000 Records Requirement)
      run: |
        php artisan migrate --force
        php artisan db:seed --class=AlumniSeeder --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: tc_main
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Run PHPUnit Tests
      env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tc_main
          DB_USERNAME: root
          DB_PASSWORD: root
      run: vendor/bin/phpunit --coverage-text

    - name: Static Code Analysis (Larastan)
      run: vendor/bin/phpstan analyse