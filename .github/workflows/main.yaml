name: CI/CD Tracer Alumni ITATS

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    
    services:
      mysql_main:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tc_main
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mysql_analytics:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tc_analytics 
        ports:
          - 3307:3306 # Mapping ke port 3307 di host agar tidak bentrok dengan 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, gd, zip, intl
        coverage: xdebug # Wajib untuk code coverage

    - name: Install Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    # Tahap 3: Security scanning for dependencies (OWASP/Dependabot)
    - name: Security Scan (Dependencies)
      run: composer audit

    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Migrations & Seeding (1000 Records Requirement)
      run: |
        # Migrasi ke DB Utama
        php artisan migrate:fresh --force
        php artisan db:seed --class=AlumniSeeder --force

        # Migrasi ke DB Analitik
        # Kita gunakan --database=mysql_analytics untuk menarget koneksi kedua
        php artisan migrate:fresh --database=mysql_analytics --path=database/migrations --force
        php artisan db:seed --class=AlumniSeeder --database=mysql_analytics --force
      env:
        # Konfigurasi DB Utama
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: tc_main
        DB_USERNAME: root
        DB_PASSWORD: root

        # Konfigurasi DB Analitik
        DB_CONNECTION_ANALYTICS: mysql
        DB_HOST_ANALYTICS: 127.0.0.1
        DB_PORT_ANALYTICS: 3307 
        DB_DATABASE_ANALYTICS: tc_analytics
        DB_USERNAME_ANALYTICS: root
        DB_PASSWORD_ANALYTICS: root

    # Tahap 2: Unit test dengan HTML report & coverage
    - name: Run PHPUnit Tests
      env:
          # DB Utama
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tc_main
          DB_USERNAME: root
          DB_PASSWORD: root

          # DB Analitik
          DB_HOST_ANALYTICS: 127.0.0.1
          DB_PORT_ANALYTICS: 3307
          DB_DATABASE_ANALYTICS: tc_analytics
          DB_USERNAME_ANALYTICS: root # User root bisa dipakai untuk keduanya di testing env
          DB_PASSWORD_ANALYTICS: root
      run: vendor/bin/phpunit --coverage-text --coverage-html build/coverage-report

    # Tahap 3: Static Code Analysis (Larastan)
    - name: Static Code Analysis (Larastan)
      run: vendor/bin/phpstan analyse

    # Tahap 2: Artifact archiving (compiled report)
    - name: Archive Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage-report
        path: build/coverage-report/
        
  # Job baru: Build & Push Docker Image (Tahap 4 Otomatisasi) 
  build-and-push:
    needs: test-and-quality # Pastikan job ini berjalan setelah pengujian
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Hanya push dari branch main

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            msfadd/tracer-app:latest
            msfadd/tracer-app:${{ github.sha }}