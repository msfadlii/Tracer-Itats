name: CI/CD Tracer Alumni ITATS

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    
    services:
      mysql_main:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tc_main
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, gd, zip, intl
        coverage: xdebug # Wajib untuk code coverage

    - name: Install Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    # Tahap 3: Security scanning for dependencies (OWASP/Dependabot)
    - name: Security Scan (Dependencies)
      run: composer audit

    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Migrations & Seeding (1000 Records Requirement)
      run: |
        php artisan migrate:fresh --force
        php artisan db:seed --class=AlumniSeeder --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: tc_main
        DB_USERNAME: root
        DB_PASSWORD: root

    # Tahap 2: Unit test dengan HTML report & coverage
    - name: Run PHPUnit Tests
      env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tc_main
          DB_USERNAME: root
          DB_PASSWORD: root
      run: vendor/bin/phpunit --coverage-text --coverage-html build/coverage-report

    # Tahap 3: Static Code Analysis (Larastan)
    - name: Static Code Analysis (Larastan)
      run: vendor/bin/phpstan analyse

    # Tahap 2: Artifact archiving (compiled report)
    - name: Archive Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage-report
        path: build/coverage-report/
        
  # Job baru: Build & Push Docker Image (Tahap 4 Otomatisasi) 
  build-and-push:
    [cite_start]needs: test-and-quality # Hanya jalan kalau tes lulus [cite: 37]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Hanya push dari branch main

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Masukkan msfadd di GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # Masukkan Token di GitHub Secrets

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: msfadd/tracer-app:latest,msfadd/tracer-app:${{ github.sha }}